{% block extra_js %}
<script>
const $ = id => document.getElementById(id);

const IMAGEKIT_PUBLIC_KEY = "{{ imagekit_public_key }}";
const IMAGEKIT_URL_ENDPOINT = "{{ imagekit_url_endpoint }}";

$("id_video_file").onchange = e => {
    const file = e.target.files[0];
    $("video-label").textContent = file ? file.name : "Click to select a video file";
};

$("customThumbnail").onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
        $("thumbPreview").src = ev.target.result;
        $("thumbPreview").classList.add("visible");
        $("thumb-label").style.display = "none";
        $("thumbnailData").value = ev.target.result;
    };
    reader.readAsDataURL(file);
};

$("uploadForm").onsubmit = async e => {
    e.preventDefault();

    const videoFile = $("id_video_file").files[0];
    const title = $("id_title").value.trim();

    if (!videoFile || !title) return;

    $("uploadOverlay").classList.add("active");
    $("submitBtn").disabled = true;
    $("errorContainer").innerHTML = "";
    window.onbeforeunload = () => "Upload in progress";

    try {
        // 1 — Auth token olish
        $("uploadStatus").textContent = "Authenticating...";
        const authRes = await fetch("{% url 'videos:imagekit_auth' %}");
        const authData = await authRes.json();

        // 2 — Videoni fetch API bilan ImageKit ga yuklash (SDK siz)
        $("uploadStatus").textContent = "Uploading video...";
        const formData = new FormData();
        formData.append("file", videoFile);
        formData.append("fileName", videoFile.name);
        formData.append("publicKey", IMAGEKIT_PUBLIC_KEY);
        formData.append("signature", authData.signature);
        formData.append("expire", authData.expire);
        formData.append("token", authData.token);
        formData.append("folder", "videos");

        const ikRes = await fetch("https://upload.imagekit.io/api/v1/files/upload", {
            method: "POST",
            body: formData,
        });

        if (!ikRes.ok) {
            const err = await ikRes.json();
            throw new Error(err.message || "ImageKit upload failed");
        }

        const uploadResult = await ikRes.json();

        // 3 — Faqat meta ma'lumotlarni serverga yuborish
        $("uploadStatus").textContent = "Saving...";
        const saveData = new FormData();
        saveData.append("title", title);
        saveData.append("description", $("id_description").value);
        saveData.append("file_id", uploadResult.fileId);
        saveData.append("video_url", uploadResult.url);
        saveData.append("thumbnail_data", $("thumbnailData").value);
        saveData.append("csrfmiddlewaretoken",
            document.querySelector("[name=csrfmiddlewaretoken]").value);

        const res = await fetch("{% url 'videos:upload_submit' %}", {
            method: "POST",
            body: saveData,
        });
        const data = await res.json();
        window.onbeforeunload = null;

        if (data.success) {
            $("uploadStatus").textContent = "Upload complete!";
            setTimeout(() => location.href = "{% url 'videos:list' %}", 500);
        } else {
            throw new Error(data.error || "Upload failed");
        }
    } catch (err) {
        window.onbeforeunload = null;
        $("uploadOverlay").classList.remove("active");
        $("submitBtn").disabled = false;
        $("errorContainer").innerHTML =
            `<ul class="error-list"><li>${err.message || "Upload failed"}</li></ul>`;
    }
};
</script>
{% endblock %}
